[package]
name = "textrill"
version = "0.1.0"
edition = "2021"
description = "Convert plain text to HTML. A Rust reimplementation of HTML::TextToHTML / txt2html."
license = "GPL-3.0-or-later"
# TODO: set repository = "https://github.com/<you>/textrill" once the host account exists.

[lib]
name = "textrill"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "textrill"
path = "src/main.rs"

[dependencies]
fancy-regex = "0.14"
pyo3 = { version = "0.23", features = ["abi3-py38"] }

[features]
# Enabled by maturin when building the Python extension module.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
strip = true