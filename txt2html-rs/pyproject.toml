[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "txt2html"
version = "3.0.0"
description = "Rust port of HTML::TextToHTML - convert plain text to HTML"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "the txt2html-rs authors" }]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "txt2html._native"
