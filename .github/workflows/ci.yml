name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      # eframe/glow builds against the desktop libraries; the metadata checks
      # are deliberately in `make metadata`, not `make verify`, so the gate
      # itself does not depend on these tools being installed.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream desktop-file-utils \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: make verify
        run: make verify

      - name: static musl acceptance
        run: make accept-musl

      - name: desktop metadata
        run: make metadata

  reproducible:
    name: reproducible build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Two clean builds must match
        run: make repro

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      # Pinned so a new cargo-deny lint cannot turn the gate red without a
      # reviewable change here.
      - name: Install supply-chain tools
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2

      - name: make deny
        run: make deny

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2

      - name: Smoke fuzz the untrusted surfaces
        run: |
          set -euo pipefail
          cd textrill/fuzz
          for t in convert_text process_chunk decode_bytes archive_unpack pack_manifest_parse link_parser; do
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu -- \
              -max_len=4096 -timeout=10 -max_total_time=60
          done
          if find artifacts -type f -print -quit | grep -q .; then
            echo "ERROR: fuzz artifacts were written; inspect and commit a regression input" >&2
            exit 1
          fi
