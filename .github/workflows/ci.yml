# What runs, and why each step is here:
#
#   fmt / clippy  -D warnings / test --release. The lints and the unit tests.
#   accept        - reference-free acceptance: the port against its own
#                   self-goldens (63 corpus cases) plus the upstream
#                   good_*.html goldens. This is the gate, and it needs no
#                   Perl. The goldens are a record of approved behaviour:
#                   recapture with `make accept-write`/`make examples-write`
#                   and review the diff.
#   examples      - the 8 real-document outputs, recorded the same way.
#   musl          - the distribution claim: a single static binary, re-accepted
#                   with the same outputs so a musl build that silently
#                   produced different bytes would fail.
#
# The parity oracle is deliberately *not* here. The Perl differential runs only
# on demand as `make diff` (materialised offline from the tracked tarball by
# `make ref`); nothing but that target depends on Perl, and a regression found
# there is a review, never a blocker.

name: CI

on:
  push:
  pull_request:

# Cancel a superseded run on the same ref. A stale red on an old commit is
# noise that trains people to ignore red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Rust crate on its own. Split out from the slow jobs so a lint failure
  # reports in under a minute.
  rust:
    name: rust (fmt, clippy, tests, acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      # Caching cargo's registry and build directory. The key includes the
      # lockfiles so a dependency change starts cold rather than building against
      # a stale cache and reporting a result nobody reproduced.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            textrill/target
            textrill-gui-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('textrill/Cargo.lock', 'textrill-gui-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: make fmt-check

      # Strict, not advisory. `make clippy` only warned while 74 warnings stood;
      # 09d13d9 cleared them and the target now passes -- -D warnings, so a new
      # warning fails the build instead of scrolling past in a log.
      - name: Lints
        run: make clippy

      - name: Unit, property, allocation and native GUI tests
        run: |
          make test
          make test-gui-rs
          make proptest
          make alloctest

      # The reference-free gate. A clean RUNDIR, not a leftover: the runner
      # compares against whatever is in its output directory, so a stale file
      # from a previous run is a comparison against the wrong thing. Pointing
      # it at a fresh path under the job's workspace is stronger than relying
      # on the runner to have cleaned it.
      - name: Reference-free acceptance (corpus + upstream goldens)
        env:
          RUNDIR: ${{ runner.temp }}/textrill-accept
        run: make accept

      - name: Real-document outputs
        run: make examples

  # The distribution binary. The CLI ships as one static musl executable so it
  # runs on Alpine and other distros without glibc. Building it is the only
  # thing that keeps that claim true, and re-running the acceptance against
  # the result is the part that matters: a build-only check would pass on a
  # musl target whose output differed from the glibc one, which is exactly
  # the class of silent divergence the rest of this file exists to catch. The target is self-contained, so no musl-gcc is needed.
  musl:
    name: musl (static CLI, acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and the musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            textrill/target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('textrill/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-

      # Builds and asserts the binary is static; see the target's comment.
      - name: Build the static binary
        run: make musl

      - name: Reference-free acceptance against the static binary
        env:
          RUNDIR: ${{ runner.temp }}/textrill-accept-musl
        run: make accept-musl