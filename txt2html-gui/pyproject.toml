[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "txt2html-gui"
version = "3.0.0"
description = "Qt front end for txt2html, a Rust port of HTML::TextToHTML 3.0"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "the txt2html-rs authors" }]
dependencies = ["txt2html>=3.0", "PySide6>=6.6"]

[project.scripts]
txt2html-gui = "txt2html_gui.app:main"

[tool.setuptools]
packages = ["txt2html_gui"]
