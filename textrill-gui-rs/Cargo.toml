[package]
name = "textrill-gui"
version = "0.1.0"
edition = "2021"
description = "Native GUI for textrill, built with egui/eframe."
license = "GPL-3.0-or-later"
repository = "https://github.com/youtubescholar/textrill"
homepage = "https://github.com/youtubescholar/textrill"

[dependencies]
textrill = { path = "../textrill" }
egui = "0.36"
# `glow` (OpenGL) rather than the default `wgpu`: it is the smaller tree, and
# it is what was validated on this host. `default_fonts` bundles a font so the
# app does not depend on the system having one. `accesskit` is deliberately
# off: the OS accessibility bridge pulls in an async/D-Bus stack, and
# `egui_kittest` builds its own access tree for tests without it.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Native file dialogs. `xdg-portal` talks to the desktop portal over D-Bus,
# which is what a Flatpak build needs, and avoids linking GTK. The default
# `wayland` feature is off because we do not parent the dialog yet.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
# Headless widget queries over AccessKit. `kittest` must match the version
# `egui_kittest` re-exports, or the query trait methods do not resolve.
egui_kittest = "0.36"
kittest = "0.3"

# Package metadata for the native distro packages. The desktop file, metainfo
# and icons are the same files the Flatpak manifest and AppImage install.
[package.metadata.deb]
maintainer = "Textrill contributors <youtubescholar@users.noreply.github.com>"
copyright = "2026, Textrill contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Native editor for textrill, with a live source/HTML split, a native preview, \
generated options, presets and an offline template manager. The command-line \
engine is available in the separate textrill package."""
depends = "$auto"
section = "text"
priority = "optional"
assets = [
    ["target/release/textrill-gui", "usr/bin/textrill-gui", "755"],
    ["../packaging/appimage/io.github.youtubescholar.Textrill.desktop", "usr/share/applications/io.github.youtubescholar.Textrill.desktop", "644"],
    ["../packaging/io.github.youtubescholar.Textrill.metainfo.xml", "usr/share/metainfo/io.github.youtubescholar.Textrill.metainfo.xml", "644"],
    ["../packaging/appimage/io.github.youtubescholar.Textrill.png", "usr/share/icons/hicolor/256x256/apps/io.github.youtubescholar.Textrill.png", "644"],
    ["../packaging/appimage/io.github.youtubescholar.Textrill.svg", "usr/share/icons/hicolor/scalable/apps/io.github.youtubescholar.Textrill.svg", "644"],
]

[package.metadata.generate-rpm]
summary = "Native GUI for textrill"
assets = [
    { source = "target/release/textrill-gui", dest = "/usr/bin/textrill-gui", mode = "755" },
    { source = "../packaging/appimage/io.github.youtubescholar.Textrill.desktop", dest = "/usr/share/applications/io.github.youtubescholar.Textrill.desktop", mode = "644" },
    { source = "../packaging/io.github.youtubescholar.Textrill.metainfo.xml", dest = "/usr/share/metainfo/io.github.youtubescholar.Textrill.metainfo.xml", mode = "644" },
    { source = "../packaging/appimage/io.github.youtubescholar.Textrill.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.youtubescholar.Textrill.png", mode = "644" },
    { source = "../packaging/appimage/io.github.youtubescholar.Textrill.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.youtubescholar.Textrill.svg", mode = "644" },
]

# This crate is built on its own; `textrill` is a path dependency, not a
# workspace member, so the GUI's heavier dependency tree cannot leak into the
# engine crate (or its musl/static CLI build).
[workspace]
