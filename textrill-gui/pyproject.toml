[build-system]
# >=77 for PEP 639: `license` as an SPDX expression plus `license-files`, which
# is what puts the actual licence text in the wheel. Declaring a licence without
# shipping it is the defect this fixes, so the floor is not optional.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textrill-gui"
version = "0.1.0"
description = "Qt front end for textrill, a Rust reimplementation of HTML::TextToHTML 3.0"
readme = "README.md"
requires-python = ">=3.8"
# SPDX expression, not free text: a machine-readable identifier is what a
# distributor's licence scanner can actually act on. The companion
# license-files line is what puts the licence in the built wheel; see the note
# on the build-system floor above. The reasoning for choosing GPLv3 over the
# LGPL option Qt also offers is in LICENSE.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "the textrill authors" }]
dependencies = ["textrill>=0.1", "PySide6>=6.6"]

[project.scripts]
textrill-gui = "textrill_gui.app:main"

[tool.setuptools]
packages = ["textrill_gui"]
